name: KStruct CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: google-chrome --version
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-validation
          path: test-results/
          retention-days: 7
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/solver-runner -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path crates/solver-runner/Cargo.toml
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-locks-${{ runner.os }}
          path: |
            src-tauri/Cargo.lock
            crates/solver-runner/Cargo.lock
          retention-days: 7
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oofem/oofem
          ref: 214b161ed3acb471f2d0104b004c37fd73bafaa2
          path: .oofem-src
      - uses: actions/cache@v4
        id: oofem-cache
        with:
          path: .oofem-build
          key: oofem-3.0-linux-214b161-sm-v1
      - name: Build OOFEM 3.0
        if: steps.oofem-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .oofem-src -B .oofem-build -DCMAKE_BUILD_TYPE=Release -DUSE_SHARED_LIB=OFF -DUSE_FM=OFF -DUSE_TM=OFF -DUSE_MPM=OFF -DUSE_PYBIND_BINDINGS=OFF
          cmake --build .oofem-build --parallel 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Analytic benchmarks with real OOFEM
        run: OOFEM_BIN="$GITHUB_WORKSPACE/.oofem-build/oofem" npm test
      - uses: dtolnay/rust-toolchain@stable
      - name: Native process integration with real OOFEM
        run: OOFEM_BIN="$GITHUB_WORKSPACE/.oofem-build/oofem" cargo test --locked --manifest-path crates/solver-runner/Cargo.toml -- --ignored
